<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Nosso Amor</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-login-body">

    <div class="admin-login-card">
        <a href="#" class="admin-logo">Nosso Amor<span>ADMIN</span></a>
        <h2>Acesso Restrito</h2>
        
        <form id="loginForm">
            <input type="email" id="email" class="admin-input" placeholder="E-mail de Administrador" required>
            <input type="password" id="senha" class="admin-input" placeholder="Senha" required>
            <div id="erro" style="color:#b3263e; font-size:13px; margin-bottom:12px; display:none;"></div>
            <button type="submit" class="btn-admin-login">Entrar no Painel</button>
        </form>
    </div>

    <script src="../js/core/config.js"></script>
    <script src="../js/api/client.js"></script>
    <script src="../js/api/auth.js"></script>
    <script src="../js/admin/auth.js"></script>
    <script>
        (async () => {
            if (await estaLogadoAdmin()) { window.location.href = "dashboard.html"; return; }

            document.getElementById("loginForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                const email = document.getElementById("email").value;
                const senha = document.getElementById("senha").value;
                const erro  = document.getElementById("erro");
                const btn   = e.target.querySelector("button");
                btn.disabled = true;
                btn.textContent = "Entrando...";

                const res = await fazerLoginAdmin(email, senha);
                if (res.ok) { window.location.href = "dashboard.html"; return; }

                if (res.code === "RATE_LIMITED" || res.code === "CLIENT_RATE_LIMITED") {
                    erro.textContent = `Muitas tentativas. Aguarde ${res.retryAfter || 60}s antes de tentar de novo.`;
                } else {
                    erro.textContent = res.error || "Credenciais incorretas.";
                }
                erro.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Entrar no Painel";
            });
        })();
    </script>
</body>
</html>
