<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Recuperar senha — Nosso Amor</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/recuperar-senha.css">
</head>
<body>
  <main class="recovery-card">
    <a href="login.html">← Voltar ao login</a>
    <h1 id="recoveryTitle">Recuperar senha</h1>
    <p id="recoveryDescription">Informe o e-mail da sua conta para receber um link de recuperação.</p>
    <form id="recoveryForm">
      <div id="emailField"><label for="recoveryEmail">Seu e-mail</label><input id="recoveryEmail" type="email" autocomplete="email" maxlength="254" required></div>
      <div id="passwordFields" hidden>
        <label for="newPassword">Nova senha</label><input id="newPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128">
        <label for="confirmPassword">Confirme a nova senha</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="128">
      </div>
      <button id="recoverySubmit" type="submit">Enviar link</button>
      <p id="recoveryMessage" role="status" aria-live="polite"></p>
    </form>
    <p><a href="recuperar-senha.html" id="requestAgain" hidden>Solicitar outro link</a></p>
    <footer><a href="termos.html">Termos</a> · <a href="privacidade.html">Privacidade</a></footer>
  </main>
  <script src="js/core/config.js"></script>
  <script src="js/api/client.js"></script>
  <script src="js/pages/recuperar-senha.js"></script>
</body>
</html>
